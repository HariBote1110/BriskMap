<!doctype html>
<html lang="en"><meta charset="utf-8"><title>BriskMap</title>
<h1>BriskMap maps</h1><ul id="maps"></ul>
<script>
fetch('/maps/index.json').then(response => response.json()).then(index => {
  const list = document.getElementById('maps');
  for (const map of index.maps) {
    const item = document.createElement('li');
    item.textContent = `${map.name} (${map.dimension}) — ${map.regions.length} regions`;
    list.append(item);
  }
}).catch(() => { document.getElementById('maps').textContent = 'Map index unavailable'; });
</script></html>
