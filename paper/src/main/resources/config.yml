web:
  enabled: true
  bind: "0.0.0.0"
  port: 8123
  threads: 4
extract:
  threads: 0 # 0 uses half of the available processors, at least one.
  caves: "hide"
  fluids: "surface"
  compression-level: 6
  scan-interval-seconds: 30
worlds:
  exclude: []
# Per-world height cut. Nether worlds default to 100; other worlds have no cut.
# maps:
#   world_nether:
#     max-y: 100
#   world:
#     max-y: none
textures:
  # Enabling this downloads Mojang's client jar and means accepting the Minecraft EULA.
  accept-mojang-download: false
